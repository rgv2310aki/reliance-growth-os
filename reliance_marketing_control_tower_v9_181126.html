.grid-3{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0;transition:opacity .2s,filter .2s}.panel-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:10px}.panel-title{font-size:12px;font-weight:800}.panel-sub{font-size:9px;color:#73819a;margin-top:3px}.badge{font-size:9px;padding:4px 7px;border-radius:5px;font-weight:800;background:#182346;color:#7892ff}.badge.yellow{background:#2a2410;color:#f1ce55}.badge.red{background:#35151c;color:#ff6d78}.badge.green{background:#103322;color:#51e590}

.control-grid{display:grid;grid-template-columns:1.35fr .8fr .8fr;gap:12px}.signal-panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px}.signal-list{display:grid;gap:8px}.signal{display:grid;grid-template-columns:8px 1fr auto;gap:10px;padding:11px 10px;background:#1a1b1e;border:1px solid #2c2e33;border-radius:8px}.signal .dot{width:7px;height:7px;border-radius:50%;margin-top:5px;background:var(--yellow)}.signal .dot.red{background:var(--red)}.signal .dot.green{background:var(--green)}.signal .t{font-size:11px;font-weight:760;line-height:1.35}.signal .s{font-size:9px;color:#7c89a1;margin-top:3px;line-height:1.45}.signal .right{font-size:9px;font-weight:800;text-align:right;white-space:nowrap}.signal-action{margin-top:8px;padding:9px 10px;border-top:1px solid var(--line);font-size:9px;color:#9aabc8;display:flex;justify-content:space-between}.signal-action b{color:#dbe5ff}

.money-map{display:grid;grid-template-columns:1fr;gap:12px}.spend-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px;overflow:hidden}.spend-summary{display:flex;align-items:center;gap:16px;overflow:hidden}.spend-total{flex:0 0 128px}.spend-total .l{font-size:9px;color:#73809a;text-transform:uppercase;letter-spacing:.09em}.spend-total .v{font-size:27px;font-weight:820;margin:5px 0}.spend-total .m{font-size:10px}.allocation{display:grid;gap:8px;flex:1 1 auto;min-width:0}.alloc-row{display:grid;grid-template-columns:88px minmax(40px,1fr) 56px 60px 46px 46px;gap:6px;align-items:center;font-size:10px;min-width:0}.alloc-name{font-weight:700;color:#dbe2ee}.alloc-track{height:7px;background:#2e3035;border-radius:8px;overflow:hidden}.alloc-track span{height:100%;display:block;background:linear-gradient(90deg,#536eff,#7c90ff)}.alloc-row:nth-child(2) .alloc-track span{background:linear-gradient(90deg,#42c9ff,#6a8cff)}.alloc-row:nth-child(3) .alloc-track span{background:linear-gradient(90deg,#2ccf8a,#58dfab)}.alloc-row:nth-child(4) .alloc-track span{background:linear-gradient(90deg,#b994ff,#c9b4ff)}.alloc-row:nth-child(5) .alloc-track span{background:linear-gradient(90deg,#e0ae47,#f4cd73)}.alloc-row:nth-child(6) .alloc-track span{background:linear-gradient(90deg,#77839a,#9ca8bd)}.alloc-row .num{text-align:right;font-variant-numeric:tabular-nums}.alloc-row .rev{color:#d7e0f0;font-weight:750}.alloc-row .roi{font-weight:800}.alloc-head{font-size:8px;text-transform:uppercase;letter-spacing:.09em;color:#6e7b95;padding-bottom:3px;border-bottom:1px solid #2c2f34}

.mm-table-wrap{margin-top:14px}
.mm-chart-legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:9px;color:#8b96ad;margin-bottom:6px}
.mm-chart-legend .dot-sw{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
.mm-chart-legend .dot-sw.good{background:#2ecb87}
.mm-chart-legend .dot-sw.warn{background:#e0ae47}
.mm-chart-legend .dot-sw.bad{background:#ff5f70}
.mm-chart-hint{margin-left:auto;color:#5c6880;font-style:italic}
.table th[data-sort]{cursor:pointer}
.table th[data-sort]:hover{color:#b7c3ff}

.full-feed{margin-top:4px}

.camp-card-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.camp-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.camp-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.camp-card .v{font-size:26px;font-weight:820;margin:2px 0}
.camp-card .sub{font-size:9px;color:#71809a;text-transform:uppercase;letter-spacing:.06em}
.camp-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.camp-metrics .mbox{background:#1a1b1e;border:1px solid #2b2e33;border-radius:7px;padding:8px}
.camp-metrics .mbox .l{font-size:8px;color:#6f7d98;text-transform:uppercase;letter-spacing:.06em}
.camp-metrics .mbox .v{font-size:14px;font-weight:800;margin-top:3px}
.camp-note{font-size:9px;color:#66738d;margin-top:10px;line-height:1.5}
.camp-row-toggle{cursor:pointer}
.camp-row-toggle:hover{background:#191a1d}
.camp-chevron{display:inline-block;width:14px;color:#7c8ba6;font-size:9px}
.adgroup-row td{background:#151619;color:#9aa7c0;font-size:9px;border-bottom:1px solid #222428}
.adgroup-row td.name{padding-left:28px;font-weight:600;color:#b7c1d4}
.ins-feed{display:grid;gap:8px}
.ins-card{background:#1a1b1e;border:1px solid #2c2e33;border-radius:8px;padding:11px;cursor:pointer;transition:border-color .15s}
.ins-card:hover{border-color:#3a4a6e}
.ins-top{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.ins-num{font-size:9px;font-weight:800;color:#6f7d98}
.ins-badge{font-size:8px;font-weight:800;letter-spacing:.05em;padding:3px 6px;border-radius:4px;text-transform:uppercase}
.ins-badge.critical{background:#35151c;color:#ff6d78}
.ins-badge.warning{background:#2a2410;color:#f1ce55}
.ins-badge.info{background:#182346;color:#7892ff}
.ins-time{margin-left:auto;font-size:8px;color:#5c6a85;white-space:nowrap}
.ins-title{font-size:11px;font-weight:760;color:#f3f6ff;line-height:1.4}
.ins-detail{font-size:9.5px;color:#8a97b1;margin-top:4px;line-height:1.5}
.ins-agent{margin-top:7px;font-size:8px;color:#6f7d98;display:flex;align-items:center;gap:5px}

.progress-row{margin-bottom:11px}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;margin-bottom:5px}
.progress-top span{color:#8b98b0}
.progress-top b{font-size:11.5px;color:#eef3ff;font-weight:800}

.workspace{display:grid;grid-template-columns:1fr 392px;gap:18px;align-items:start}
.workspace-main{min-width:0}
.workspace-side{position:sticky;top:88px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 104px);overflow-y:auto;padding:14px;min-width:0;background:linear-gradient(180deg,rgba(93,120,255,.07),rgba(93,120,255,.015) 40%,transparent);border:1px solid #303a63;border-radius:14px;box-shadow:0 0 0 1px rgba(93,120,255,.04) inset,var(--shadow)}
.side-rail-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:850;letter-spacing:.05em;text-transform:uppercase;color:#c9d4ff;padding-bottom:6px;margin-bottom:2px;border-bottom:1px solid #303a63}
.side-rail-head .live-dot{width:7px;height:7px;box-shadow:0 0 8px rgba(57,211,123,.6)}
.workspace-side .agent-strip{flex-wrap:nowrap;overflow-x:auto;margin-bottom:2px;mask-image:linear-gradient(90deg,#000 88%,transparent)}
.workspace-side .agent-pill{padding:6px 10px;font-size:9px}
.workspace-side .dq-list{margin-bottom:0}
.workspace-side .dq-card{grid-template-columns:5px 1fr}
.workspace-side .dq-card .right{grid-column:2;align-items:flex-start;margin-top:8px;min-width:0}
.workspace-side .decision-grid{grid-template-columns:1fr}
.workspace-main .grid-3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.rail-section-title{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#71809a;margin-top:4px}

.control-grid>*,.grid-3>*,.decision-grid>*,.camp-card-row>*,.detail-grid>*,
.camp-metrics>*,.decision-metrics>*,.metric-strip>*,.workspace>*,.alloc-row>*{min-width:0}
.table td.name{white-space:normal;word-break:break-word}
.panel,.signal-panel,.camp-card,.decision-card,.ins-card,.dq-card,.spend-card,
.bucket-chip,.mbox,.dmetric,.metric-box,.decision-card,.money-note{overflow:hidden}
.decision-title,.camp-note,.ins-title,.ins-detail,.money-note,.signal .s,.dq-card .s,
.alloc-name{overflow-wrap:break-word}

.bucket-row{display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.bucket-chip{flex:1;min-width:170px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 14px;display:flex;flex-direction:column;gap:5px}
.bucket-chip .l{font-size:9px;color:#71809a;text-transform:uppercase;letter-spacing:.07em}
.bucket-chip .v{font-size:18px;font-weight:820}
.bucket-chip .m{font-size:9.5px;color:#8a97b1;font-weight:700}

.notify-row{display:flex;gap:6px;margin-top:8px}
.notify-row select{flex:1}
.notify-template{width:100%;margin-top:8px;background:#141519;border:1px solid var(--line);border-radius:8px;color:#c7d0df;font:inherit;font-size:10.5px;line-height:1.6;padding:9px 10px;resize:vertical;box-sizing:border-box}
.notify-template:focus{outline:none;border-color:#4e66cc}

@media(max-width:1440px){.workspace{grid-template-columns:1fr}.workspace-side{position:static;max-height:none;overflow-y:visible}.workspace-side .decision-grid{grid-template-columns:1fr 1fr}}
@media(max-width:1200px){.app{grid-template-columns:210px 1fr}.control-grid{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:1fr 1fr}.decision-grid{grid-template-columns:1fr 1fr}.alloc-row{grid-template-columns:88px minmax(40px,1fr) 56px 60px 46px 46px}}
@media(max-width:860px){.sidebar{display:none}.app{grid-template-columns:1fr}.topbar{position:relative}.control-grid,.grid-3,.detail-grid,.decision-grid,.camp-card-row{grid-template-columns:1fr}.camp-metrics{grid-template-columns:1fr 1fr}.spend-summary{flex-wrap:wrap}.alloc-row{grid-template-columns:100px minmax(40px,1fr) 60px}.alloc-row .roi{display:none}.alloc-row .delta{display:none}.top-right .user{display:none}.content{padding:16px}.metric-strip{grid-template-columns:repeat(2,1fr)}.dq-card{grid-template-columns:5px 1fr}.dq-card .right{grid-column:2;align-items:flex-start;margin-top:8px}}
@media(max-width:520px){.topbar{height:auto;padding:12px 14px;gap:12px;flex-wrap:wrap}.top-right{width:100%;overflow:auto}.toolbar{gap:10px;flex-wrap:wrap}.modal-grid{grid-template-columns:1fr 1fr}.ot-strip{flex-direction:column;align-items:stretch}}
</style>
